[project]
name = "leave-manager"
version = "0.1.0"
description = "Leave Manager — eğitim/demo izin yönetimi uygulaması"
requires-python = ">=3.12"
# Exact pins (docs/security.md, Dependencies). Transitive pins: requirements-lock.txt.
dependencies = [
    "fastapi==0.162.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
markers = [
    "integration: API tests through TestClient — full profile only (docs/testing.md)",
]
