# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md).
# Activated by spec 0001 (walking skeleton). Commands run from the repo root via sh -c.
#
# Format: <name>: <command>  ·  [fast] in the NAME = runs in ./scripts/check --fast.
#         requires <step name>: <command>  — exit 0 when this machine can run the step.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
# - tools/py runs the project .venv Python (no activated shell needed).
# - ruff, mypy: single process, exit on completion. Caches (.ruff_cache, .mypy_cache) are data,
#   gitignored. No daemon: never dmypy.
# - pytest: single process, no xdist workers; TestClient runs the app in-process (no server).
#   Data: no database yet; from the first DB spec on, every test gets a fresh SQLite DB (rule 5).
# - node --test: one child process per test file, all exit with the run; no --watch (rule 4).
# Split by selector (rule 4): pytest marker `integration` is added by folder
# (backend/tests/integration/conftest.py) — fast runs "not integration", full adds "integration".

requires lint: tools/py -c "import sys, fastapi, pytest, mypy; sys.exit(0 if sys.version_info[:2] >= (3, 12) else 1)"
requires frontend-test: node -e "require.resolve('jsdom'); process.exit(+process.versions.node.split('.')[0] >= 16 ? 0 : 1)"

lint [fast]: tools/py -m ruff check backend
format [fast]: tools/py -m ruff format --check backend
types [fast]: tools/py -m mypy
test [fast]: tools/py -m pytest -q -p no:cacheprovider -m "not integration"
frontend-test [fast]: node --test frontend/tests/
integration: tools/py -m pytest -q -p no:cacheprovider -m integration
