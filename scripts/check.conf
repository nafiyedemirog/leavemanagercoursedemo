# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md).
# GREENFIELD: rule 1 (no spec, no code) means no code exists yet, so every step below is a
# planned step, commented out. The walking skeleton spec creates the toolchain and uncomments
# them (with exact commands), then runs the residue test in both profiles.
#
# Format: <name>: <command>  ·  [fast] in the NAME = runs in ./scripts/check --fast.
#         requires <step name>: <command>  — exit 0 when this machine can run the step.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
# - ruff, mypy: single process, exit on completion. mypy writes .mypy_cache (data, not a
#   process; gitignored) — no daemon: never use dmypy.
# - pytest: single process; no xdist workers planned. Data: every test gets a fresh SQLite DB
#   (in-memory + StaticPool or tmp_path) — nothing reaches the next run (rule 5).
# - node --test: spawns one child per test file, all exit with the run; no --watch (rule 4).
# - No server is started by check: TestClient runs the app in-process.
#
# --- planned (walking skeleton activates) ---
# requires lint: python -c "import sys; sys.exit(0 if sys.version_info[:2] >= (3, 12) else 1)"
# requires frontend-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 22 ? 0 : 1)"
#
# lint [fast]: python -m ruff check backend
# format [fast]: python -m ruff format --check backend
# types [fast]: python -m mypy backend/app
# test [fast]: python -m pytest -q -m "not integration" backend/tests
# frontend-test [fast]: node --test frontend/
# integration: python -m pytest -q -m integration backend/tests
